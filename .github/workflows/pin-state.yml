# Pin the desired state on a deploy/<env> state branch (ADR-0018).
#
# Single-writer design: ALL writers to a deploy/<env> state branch live in
# this repository and share one concurrency group, deploy-state-<env>, so
# GitHub itself serializes them — a pin can never race a sync (the
# historical "cannot lock ref" failure). The pin is triggered by a
# repository_dispatch from a deploy pipeline (e.g. the /deploy-test
# workflow of botforge-services, authenticated as the kingdoms-deployer
# App, whose token is the only non-admin actor allowed to write the state
# branches); the client passes the whole state as client_payload, so the
# pinned values cannot drift from what the pipeline built.
#
# The pin also merges origin/main into the state branch and pushes the
# merge and the pin together: every deployment carries the current
# manifests, workflows and scripts — no separate sync can lose a race
# against it (they share the concurrency group anyway). The sync-state
# workflow remains the catch-up path for infra-only changes.
#
# Single job (no matrix): the env comes from the dispatch payload — the
# job-level `if` cannot reference `matrix` (it is evaluated before the
# matrix expansion), which is what broke the first deployment. The env is
# validated against the envs/ data below; adding an environment is adding its
# envs/<name>/ directory (ruleset and hosting install aside).

name: Pin state

on:
  repository_dispatch:
    types: [pin-state]

permissions:
  contents: write

jobs:
  pin:
    name: Pin deploy/<env> state
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-state-${{ github.event.client_payload.env }}
      cancel-in-progress: false
    steps:
      - name: Check out main (environment data)
        uses: actions/checkout@v4
      - name: Validate the dispatch payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          # An environment is a directory under envs/ — the payload must
          # name one that exists (data, not a whitelist: adding an env is
          # adding its envs/<name>/ directory, nothing else).
          env_name="$(jq -r '.env // empty' <<<"$PAYLOAD")"
          if [[ -z "$env_name" || ! -f "envs/${env_name}/docker-compose.yml" ]]; then
            echo "::error::unknown or missing environment '$env_name' (no envs/${env_name}/docker-compose.yml on main)"
            exit 1
          fi
          echo "env_name=$env_name" >> "$GITHUB_ENV"
          # The GitHub API caps a client_payload at 10 properties — the
          # emitters sit at exactly 10, so an over-cap dispatch fails with
          # a 422 before reaching this workflow. Say it here too: if this
          # check ever fires, an emitter gained a property (see
          # botforge-services scripts/check_pin_payloads.sh, the CI guard).
          count="$(jq 'keys | length' <<<"$PAYLOAD")"
          if (( count > 10 )); then
            echo "::error::the pin-state dispatch payload carries ${count} properties — the GitHub API cap is 10; compose the extra fields here instead of passing them"
            exit 1
          fi
          for field in image version_label deploy_kind deploy_ref deploy_tree_url deploy_branch; do
            value="$(jq -r --arg f "$field" '.[$f] // empty' <<<"$PAYLOAD")"
            if [[ -z "$value" ]]; then
              echo "::error::the pin-state dispatch payload is missing the '$field' field"
              exit 1
            fi
          done
      - name: Mint the kingdoms-deployer App token (state-branch writer)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOTFORGE_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.BOTFORGE_DEPLOYER_APP_PRIVATE_KEY }}
          owner: jj-guild
          repositories: botforge-infra
      - name: Configure git
        run: |
          git config --global user.name "kingdoms-deployer[bot]"
          git config --global user.email "noreply@jj-guild.org"
      - name: Check whether the state branch exists
        id: state-branch
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git ls-remote "https://x-access-token:${APP_TOKEN}@github.com/jj-guild/botforge-infra.git" "refs/heads/deploy/${{ env.env_name }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.state-branch.outputs.exists == 'true' && format('deploy/{0}', env.env_name) || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge origin/main, write the pinned state, push
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          STATE_BRANCH_EXISTS: ${{ steps.state-branch.outputs.exists }}
        run: |
          set -euo pipefail
          env_name="${{ env.env_name }}"
          if [[ "${STATE_BRANCH_EXISTS}" != "true" ]]; then
            echo "deploy/${env_name} does not exist yet — bootstrapping it from main (first pin)."
            git checkout -b "deploy/${env_name}"
          fi
          git remote set-branches origin '*'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "deploy/${env_name} already contains main — no merge needed."
          else
            git merge origin/main --no-edit -m "deploy(${env_name}): sync state branch with main"
          fi
          state_file="envs/${env_name}/state/botforge-bot.yml"
          # One-time migrations: state branches created before the envs/
          # layout still carry the file at deploy/state/<env>/, and branches
          # synced before the botforge rename still carry it under the old
          # kingdoms-bot.yml name. Move it in the same commit as the pin, so
          # the merge from main cannot lose it.
          if [[ ! -f "$state_file" ]]; then
            for legacy in "envs/${env_name}/state/kingdoms-bot.yml" "deploy/state/${env_name}/kingdoms-bot.yml"; do
              if [[ -f "$legacy" ]]; then
                mkdir -p "envs/${env_name}/state"
                git mv "$legacy" "$state_file"
                rmdir "deploy/state/${env_name}" "deploy/state" 2>/dev/null || true
                break
              fi
            done
          fi
          if [[ ! -f "$state_file" ]]; then
            if [[ "${STATE_BRANCH_EXISTS}" == "true" ]]; then
              echo "::error::state file ${state_file} missing on deploy/${env_name}" >&2
              exit 1
            fi
            mkdir -p "envs/${env_name}/state"
            echo "# Bootstrapped by the first pin (ADR-0018): deploy/${env_name} did not exist." > "$state_file"
          fi
          field() { jq -r --arg f "$1" '.[$f] // ""' <<<"$PAYLOAD"; }
          # message, source and every composed identity are written here
          # (not passed in the dispatch payload, capped at 10 properties by
          # the GitHub API): the commit sha and date are resolved from the
          # deployed ref (releases pin the tag, not the sha), the CI job id
          # and number from the ci_run passed by the emitter, and the PR
          # title from the deploy kind — all properties of their objects,
          # never of the pipeline run itself.
          commit_url="$(field deploy_tree_url)"
          commit_ref="${commit_url##*/}"
          # Releases pin the tag: the real commit sha is a property of the
          # tag, resolved here via the GitHub API — the payload cap (10
          # properties) leaves no room for another field, and /status must
          # never render the tag as the commit.
          commit_sha="$(gh api "repos/jj-guild/botforge-services/commits/${commit_ref}" --jq '.sha' 2>/dev/null || true)"
          [[ -n "$commit_sha" ]] || commit_sha="$commit_ref"
          committed="$(gh api "repos/jj-guild/botforge-services/commits/${commit_ref}" --jq '.commit.committer.date' 2>/dev/null || true)"
          commit_ts=""
          [[ -n "$committed" ]] && commit_ts="$(date -u -d "$committed" +%s 2>/dev/null || true)"
          [[ -n "$commit_ts" ]] || echo "::warning::deploy_commit_ts not resolved for ${commit_ref}; the announcement renders no Committed date"
          # The CI job that built the image: the emitter passes its run id
          # (ci_run) — the id and the run number are run properties, resolved
          # here through the same API budget (composed, not passed: the
          # payload stays at exactly 10 properties).
          ci_run_id="$(field ci_run)"
          ci_run_number=""
          ci_run_ts=""
          if [[ -n "$ci_run_id" ]]; then
            ci_run_number="$(gh api "repos/jj-guild/botforge-services/actions/runs/${ci_run_id}" --jq '.run_number' 2>/dev/null || true)"
            [[ -n "$ci_run_number" ]] || echo "::warning::CI run number not resolved for run ${ci_run_id}; /status shows the run id"
            run_started="$(gh api "repos/jj-guild/botforge-services/actions/runs/${ci_run_id}" --jq '.run_started_at' 2>/dev/null || true)"
            [[ -n "$run_started" ]] && ci_run_ts="$(date -u -d "$run_started" +%s 2>/dev/null || true)"
            [[ -n "$ci_run_ts" ]] || echo "::warning::CI run date not resolved for run ${ci_run_id}; the Job CI line renders no date"
          fi
          # The PR title is composed here too (botforge-services deploy.yml
          # passes ci_run instead — the /deploy run has the PR in context
          # anyway and the payload had no room for both).
          deploy_kind="$(field deploy_kind)"
          deploy_ref="$(field deploy_ref)"
          pr_title=""
          if [[ "$deploy_kind" == "pr" ]]; then
            pr_title="$(gh api "repos/jj-guild/botforge-services/pulls/${deploy_ref}" --jq '.title' 2>/dev/null || true)"
          fi
          branch="$(field deploy_branch)"
          message="$(field message)"
          [[ -n "$message" ]] || message="deploy(${env_name}): pin $(field version_label)"
          {
            echo "# Desired state of botforge-bot on the ${env_name} environment (ADR-0018)."
            echo "# Written by the deploy pipelines only (kingdoms-deployer GitHub App);"
            echo "# a push to this branch deploys this exact image."
            echo "image: $(field image)"
            echo "version_label: $(field version_label)"
            echo "deploy_url: $(field deploy_url)"
            echo "deploy_kind: ${deploy_kind}"
            echo "deploy_ref: ${deploy_ref}"
            echo "deploy_tree_url: $(field deploy_tree_url)"
            echo "deploy_ts: $(date -u +%s)"
            echo "deploy_commit_ts: ${commit_ts}"
            echo "deploy_commit: ${commit_sha}"
            echo "deploy_ci_run_id: ${ci_run_id}"
            echo "deploy_ci_run_number: ${ci_run_number}"
            echo "deploy_ci_run_ts: ${ci_run_ts}"
            echo "deployed_by: $(field deployed_by)"
            echo "deployed_at: \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "source: $(field source)"
            echo "deploy_branch: ${branch}"
            echo "deploy_pr_title: ${pr_title}"
          } > "$state_file"
          git add "$state_file"
          git commit -m "$message"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/jj-guild/botforge-infra.git"
          git push origin HEAD:deploy/${env_name}
          echo "state pinned on deploy/${env_name}: $(field image)"
