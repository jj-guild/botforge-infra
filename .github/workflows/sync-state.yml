# Propagate pipeline changes from main to every deploy/<env> state branch
# (ADR-0018, docs/ENVIRONMENTS.md § "Keeping the state branches current").
#
# The state branches run the deploy workflows in their own revision: a merge
# on main that touches a deploy workflow, a deploy/<env>/ manifest or
# scripts/deploy.sh keeps running in its old revision on the state branch
# until it is propagated. This workflow automates the propagation.
#
# The push uses the kingdoms-deployer App token — the same actor the deploy
# pipelines use to write the pinned state, and the only non-admin actor in
# the deploy/* ruleset bypass lists. Sync pushes carry no pipeline change,
# so the Deploy <env> workflow they trigger redeploys the unchanged pinned
# state — safe by design. The rulesets (no force-push) keep the sync
# history auditable.
#
# Single-writer design (ADR-0018): every writer to a deploy/<env> state
# branch lives in this repository and shares one concurrency group,
# deploy-state-<env> — pin-state.yml (image pins dispatched by the deploy
# pipelines), this sync workflow, and the re-pin job of deploy.yml.
# GitHub serializes them, so a sync can never race a pin (the historical
# "cannot lock ref" failure). Known limit: only the latest queued run of
# a group survives; a superseded sync is re-triggered by the next push to
# main.
#
# One job per environment, parameterized only by the env name: adding an
# environment is adding it to the matrix (plus its ruleset and VPS install).
name: Sync state branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  discover:
    # Environments are data: the sync matrix is the envs/*/ directories on
    # main — adding an environment is adding its directory, nothing else.
    name: Discover the environments
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
      - name: List the environment directories
        id: list
        run: echo "envs=$(find envs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -s . | jq -c .)" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync deploy/${{ matrix.env }} with main
    needs: discover
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-state-${{ matrix.env }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.discover.outputs.envs) }}
    steps:
      - name: Mint the kingdoms-deployer App token (state-branch writer)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOTFORGE_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.BOTFORGE_DEPLOYER_APP_PRIVATE_KEY }}
          owner: jj-guild
          repositories: botforge-infra
      - name: Configure git
        run: |
          git config --global user.name "kingdoms-deployer[bot]"
          git config --global user.email "noreply@jj-guild.org"
      - name: Skip when the state branch does not exist yet
        # A personal env's state branch is created by its first autopin;
        # syncing a missing branch would fail on the checkout.
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! git ls-remote "https://x-access-token:${APP_TOKEN}@github.com/jj-guild/botforge-infra.git" "refs/heads/deploy/${{ matrix.env }}" | grep -q .; then
            echo "deploy/${{ matrix.env }} does not exist yet — the first pin-state creates it; nothing to sync."
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.skip != 'true'
        with:
          ref: deploy/${{ matrix.env }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve the pinned state across the merge
        # The state file is authoritative on the state branch (written by the
        # deploy pipelines); the merge from main must not overwrite or drop
        # it — main carries its own copy of the pin under the old name before
        # the botforge rename.
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          env="${{ matrix.env }}"
          mkdir -p /tmp/state-preserve
          for f in "envs/${env}/state/botforge-bot.yml" "envs/${env}/state/kingdoms-bot.yml" "deploy/state/${env}/kingdoms-bot.yml"; do
            if [[ -f "$f" ]]; then cp "$f" "/tmp/state-preserve/$(basename "$f")"; fi
          done
      - name: Merge origin/main into the state branch
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          git remote set-branches origin '*'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "deploy/${{ matrix.env }} already contains main — nothing to sync."
            exit 0
          fi
          msg="deploy(${{ matrix.env }}): sync state branch with main"
          if ! git merge origin/main --no-edit -m "$msg"; then
            # The state-file rename (kingdoms-bot.yml → botforge-bot.yml) can
            # raise a modify/delete conflict that -X cannot resolve. Fall back
            # to the ADR-0018 invariant: a state branch is exactly main + its
            # own pinned state file (restored by the next step).
            git merge --abort
            git read-tree -u --reset origin/main
            git commit -m "$msg"
          fi
      - name: Restore the pinned state at its new path (rename rides the sync)
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          env="${{ matrix.env }}"
          state_file="envs/${env}/state/botforge-bot.yml"
          src=""
          if [[ -f "/tmp/state-preserve/botforge-bot.yml" ]]; then src="/tmp/state-preserve/botforge-bot.yml"; fi
          if [[ -z "$src" && -f "/tmp/state-preserve/kingdoms-bot.yml" ]]; then src="/tmp/state-preserve/kingdoms-bot.yml"; fi
          if [[ -n "$src" ]]; then
            mkdir -p "envs/${env}/state"
            cp "$src" "${state_file}"
            rm -f "envs/${env}/state/kingdoms-bot.yml" "deploy/state/${env}/kingdoms-bot.yml"
            rmdir "deploy/state/${env}" "deploy/state" 2>/dev/null || true
            git add -A "envs/${env}/state" "deploy/state" 2>/dev/null || true
            git commit --amend --no-edit
            echo "pinned state preserved at ${state_file}"
          elif [[ -f "deploy/state/${env}/kingdoms-bot.yml" ]]; then
            # One-time migration (envs/ layout): state branches created before
            # the move still carry the file at deploy/state/<env>/.
            mkdir -p "envs/${env}/state"
            git mv "deploy/state/${env}/kingdoms-bot.yml" "${state_file}"
            rmdir "deploy/state/${env}" "deploy/state" 2>/dev/null || true
            git commit --amend --no-edit
            echo "state file migrated to ${state_file}"
          fi
      - name: Push the synced state branch
        if: env.skip != 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/jj-guild/botforge-infra.git"
          git push origin HEAD:deploy/${{ matrix.env }}
